[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "IMesh"
version = "0.1.0"
description = "IMesh — a local-first intelligent mesh network"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "OpenClaw" }
]
license = { text = "MIT" }
dependencies = [
  "asyncio",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "websockets>=12.0",
  "httpx>=0.27.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "zeroconf>=0.132.2",
  "cryptography>=42.0.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "black>=24.0.0",
  "mypy>=1.10.0",
]

[project.scripts]
IMesh = "openclaw_mesh.cli:main"
openclaw-mesh = "openclaw_mesh.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["openclaw_mesh*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
